[package]
name = "dili"
version = "0.1.0"
description = "高中地理过程动画"
authors = ["you"]
edition = "2021"

[lib]
name = "dili_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
